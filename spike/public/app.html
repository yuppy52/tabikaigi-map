<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>旅会議マップ（試作のアプリ画面）</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 16px; max-width: 720px; }
    #status { padding: 4px 8px; background: #eef; display: inline-block; border-radius: 4px; }
    #prefs { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 4px; margin: 12px 0; }
    #prefs button { padding: 8px 2px; border: 1px solid #ccc; background: #fff; border-radius: 4px; }
    #prefs button.others { background: #ffe9c7; }
    #prefs button.mine { background: #f59e0b; color: #fff; }
    #log { font-size: 12px; color: #555; max-height: 240px; overflow: auto; }
  </style>
</head>
<body>
  <h1>アプリの画面<span id="marker" hidden>APP_HTML</span></h1>
  <form id="create">
    <p>試しのグループを作る：<input id="create-name" placeholder="自分の名前" required maxlength="10"> <button>作る</button></p>
  </form>
  <section id="room">
    <h2 id="group-name"></h2>
    <p><span id="status">準備中</span></p>
    <p>自分：<select id="me"></select></p>
    <form id="join"><input id="join-name" placeholder="名前を入れて参加" maxlength="10"> <button>参加</button></form>
    <div id="prefs"></div>
    <h3>記録</h3>
    <ul id="log"></ul>
  </section>
  <script type="module" src="/demo.js"></script>
</body>
</html>
