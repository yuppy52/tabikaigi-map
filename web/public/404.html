<!doctype html>
<!-- ファイルがない URL で返すページ（wrangler.jsonc の not_found_handling）。Worker を通らない素の HTML。文言は Phase 3 で整える -->
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 招待URLを打ち間違えたときもここに来るので、参照元を渡さない -->
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <title>ページが見つかりません｜旅会議マップ</title>
  </head>
  <body>
    <h1>ページが見つかりません</h1>
    <p><a href="/">トップへ</a></p>
  </body>
</html>
