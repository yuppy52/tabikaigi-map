<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- _headers の noindex と no-referrer の二重の守り（_headers に書き忘れた URL で出ても効く：2026-10-21 access-reviewer #2） -->
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <title>旅会議マップ</title>
    <!-- 招待URLを LINE などで送ったときのカード（architecture の「招待URLのプレビュー（OGP）」）。
         LINE のクローラーは JavaScript を動かさないので、全グループ共通の固定の値を HTML に直接書く。
         og:url は書かない（グループごとに URL が違うため）。画像は https の絶対の URL（www なし） -->
    <meta property="og:title" content="旅会議マップ" />
    <meta property="og:description" content="友達と行った都道府県を塗って、次の旅行先を決めよう" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://tabikaigi-map.com/ogp.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
