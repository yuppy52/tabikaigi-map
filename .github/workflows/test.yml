# プルリクエストごとに、型の確かめ、lint、見た目のそろい、API・D1 のテストを動かす。
# 公開リポジトリなので、GitHub が用意する標準のマシンは無料（2026-10-12）
name: test

on:
  pull_request:
  push:
    branches: [main]

# 読むだけの権限にする（書き込みや秘密の値は使わない）
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 外の部品は、書き換えられても中身が変わらないように、版ではなくコミットの番号で指定する
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
