<title>旅会議マップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
:root{
  --sea:#E6EDF1; --bg:#F3F6F8; --surface:#FFFFFF; --ink:#1B2630; --ink2:#5B6B77; --line:#D3DCE2;
  --land:#FFFFFF; --border:#A9B8C2;
  --h1:#D5E5F4; --h2:#98BFE6; --h3:#5890CE; --h4:#23579E;
  --accent:#23579E; --accent-ink:#FFFFFF;
  --gap-fill:#FDE9BD; --gap-line:#E39A12;
  --shadow:0 8px 28px rgba(20,40,60,.14);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sea:#0E151B; --bg:#121A21; --surface:#1A242D; --ink:#E6EDF2; --ink2:#95A5B1; --line:#2C3A45;
    --land:#233039; --border:#445662;
    --h1:#1F3A57; --h2:#2E5F93; --h3:#4F89CC; --h4:#9CC6F2;
    --accent:#6EA6E6; --accent-ink:#0E151B;
    --gap-fill:#4A3A12; --gap-line:#F0B94A;
    --shadow:0 8px 28px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --sea:#0E151B; --bg:#121A21; --surface:#1A242D; --ink:#E6EDF2; --ink2:#95A5B1; --line:#2C3A45;
  --land:#233039; --border:#445662;
  --h1:#1F3A57; --h2:#2E5F93; --h3:#4F89CC; --h4:#9CC6F2;
  --accent:#6EA6E6; --accent-ink:#0E151B;
  --gap-fill:#4A3A12; --gap-line:#F0B94A;
  --shadow:0 8px 28px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
.disp{font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 120px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px}
.gname{flex:1;min-width:0}
.gname small{display:block;color:var(--ink2);font-size:12px;letter-spacing:.04em}
.gname b{font-size:19px;font-weight:900;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.me-chip{display:inline-flex;align-items:center;gap:6px;border:none;background:var(--surface);border-radius:999px;padding:4px 10px 4px 4px;font-size:13px;box-shadow:0 0 0 1px var(--line)}
.dot{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:11px;font-weight:700;flex:none}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-radius:12px;padding:4px;box-shadow:0 0 0 1px var(--line);gap:4px}
.tabs button{border:none;background:none;border-radius:9px;padding:8px 4px;font-size:14px;font-weight:700;color:var(--ink2)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}

/* summary */
.summary{display:flex;flex-direction:column;gap:10px;margin-block:14px}
.big{display:flex;align-items:baseline;gap:8px}
.big .n{font-size:40px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.big .of{color:var(--ink2)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.members{display:flex;flex-direction:column;gap:8px}
.mrow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;font-size:14px}
.mrow .bar{grid-column:2}
.mrow .cnt{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:13px;min-width:48px;text-align:right}
.mrow .nm{display:flex;align-items:center;gap:8px;min-width:88px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.mchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;display:inline-flex;align-items:center;gap:6px;font-size:14px}
.mchip[aria-pressed="true"]{box-shadow:0 0 0 2px var(--c);border-color:transparent;font-weight:700}

/* map */
.mapcard{background:var(--sea);border-radius:18px;position:relative;overflow:hidden}
.mapcard svg{display:block;width:100%;height:auto;touch-action:manipulation}
.pref{stroke:var(--border);stroke-width:.7;vector-effect:non-scaling-stroke;stroke-linejoin:round;transition:fill .2s}
.pref.tap{cursor:pointer}
.pref.gap{stroke:var(--gap-line);stroke-width:1.6}
.inset{fill:none;stroke:var(--border);stroke-dasharray:4 4}
.inset-label{fill:var(--ink2);font-size:18px}
.legend{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--ink2);background:color-mix(in srgb,var(--surface) 88%,transparent);padding:8px 10px;border-radius:10px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:10px;border-radius:3px;border:1px solid var(--border)}
.hint{font-size:12px;color:var(--ink2);margin-block:8px 0}

/* gap card */
.gapcard{margin-block:14px;background:var(--surface);border-radius:14px;padding:14px;box-shadow:0 0 0 1px var(--line);display:flex;flex-direction:column;gap:10px}
.gaphead{display:flex;align-items:center;gap:10px}
.gaphead b{flex:1;font-size:15px}
.switch{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}
.switch[aria-pressed="true"]{background:var(--gap-fill);border-color:var(--gap-line)}

/* pref list */
.region{margin-block:18px 0}
.region h3{font-size:13px;color:var(--ink2);font-weight:700;letter-spacing:.06em;margin:0 0 8px}
.pchip{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;font-size:14px;display:inline-flex;align-items:center;gap:6px;min-height:36px}
.pchip.on{background:var(--pc,var(--accent));border-color:transparent;color:#fff;font-weight:700}
.pchip.gapc{background:var(--gap-fill);border-color:var(--gap-line)}
.pchip em{font-style:normal;font-size:11px;color:var(--ink2);font-variant-numeric:tabular-nums}
.pchip.heat em{color:inherit}
.pchip .sw{width:10px;height:10px;border-radius:3px;border:1px solid var(--border)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,30,.4);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:var(--shadow);padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;max-height:85%;overflow:auto}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-size:22px;margin:0 0 4px;font-weight:900}
.sheet .sub{color:var(--ink2);font-size:13px;margin:0 0 14px}
.who{display:flex;flex-direction:column;gap:6px;margin-block:0 16px}
.who .row{display:flex;align-items:center;gap:10px;font-size:15px}
.who .row .st{margin-left:auto;font-size:13px;color:var(--ink2)}
.who .row.yes .st{color:var(--ink);font-weight:700}
.primary{width:100%;border:none;border-radius:12px;padding:13px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px}
.primary.ghost{background:var(--bg);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.field{display:flex;flex-direction:column;gap:6px;margin-block:0 14px}
.field label{font-size:13px;color:var(--ink2);font-weight:700}
.field input{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:16px}
.linkbtn{background:none;border:none;color:var(--accent);font-weight:700;padding:10px;width:100%}
.invite{background:var(--bg);border-radius:14px;padding:14px;margin-block:0 16px;display:flex;gap:12px;align-items:center}
.invite .avs{display:flex}
.invite .avs .dot{box-shadow:0 0 0 2px var(--bg);margin-left:-6px}
.invite .avs .dot:first-child{margin-left:0}
.urlbox{display:flex;gap:8px;align-items:center;background:var(--bg);border-radius:12px;padding:8px 8px 8px 12px;margin-block:0 14px}
.urlbox code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;user-select:all}
.mock-note{font-size:12px;color:var(--ink2);margin:0 0 14px}
.namelist{display:flex;flex-direction:column;gap:6px;margin-block:0 14px}
.namelist button{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 12px;text-align:left}
.namelist button[aria-current="true"]{box-shadow:inset 0 0 0 2px var(--accent)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:30;box-shadow:var(--shadow);white-space:nowrap}
.badge-mock{font-size:10px;font-weight:700;letter-spacing:.08em;background:var(--gap-fill);color:var(--ink);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
@media (prefers-reduced-motion: reduce){.pref{transition:none}}
</style>

<div class="wrap">
  <header class="top">
    <div class="gname disp">
      <small>グループ <span class="badge-mock">MOCK</span></small>
      <b id="gTitle">夏旅2026</b>
    </div>
    <button class="iconbtn" id="shareBtn" type="button" aria-label="招待リンクを表示">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>招待
    </button>
    <button class="me-chip" id="meBtn" type="button" aria-label="ユーザーを切り替える"></button>
  </header>

  <div class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="mine" type="button">わたし</button>
    <button role="tab" data-tab="all" type="button">みんな</button>
    <button role="tab" data-tab="member" type="button">メンバー別</button>
  </div>

  <section class="summary" id="summary"></section>

  <div class="mapcard">
    <svg id="map" viewBox="0 0 1000 1000" role="img" aria-label="日本地図"></svg>
    <div class="legend" id="legend"></div>
  </div>
  <p class="hint" id="hint"></p>

  <section class="gapcard" id="gapcard" hidden></section>

  <section id="list"></section>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
<div class="toast" id="toast" hidden></div>

<script id="geo" type="application/json">__PATHS__</script>
<script>
(function(){
const GEO = JSON.parse(document.getElementById('geo').textContent);
const P = GEO.p;
const short = n => n==='北海道' ? n : n.replace(/[都府県]$/,'');
const REGIONS = [
  ['北海道・東北',[1,2,3,4,5,6,7]],
  ['関東',[8,9,10,11,12,13,14]],
  ['中部',[15,16,17,18,19,20,21,22,23]],
  ['近畿',[24,25,26,27,28,29,30]],
  ['中国',[31,32,33,34,35]],
  ['四国',[36,37,38,39]],
  ['九州・沖縄',[40,41,42,43,44,45,46,47]],
];
const COLORS = ['#2F7FD1','#E0692F','#2A9D6E','#9B5BD0','#D2497A','#7B8A1E'];

// ---- data (mock: saved in this browser only) ----
const KEY = 'tabikaigi-mock-v1';
function demo(){
  return {
    code:'natsu2026',
    name:'夏旅2026',
    members:[
      {id:'m1',name:'たろう',color:COLORS[1],visited:[1,2,4,8,11,12,13,14,19,20,22,23,26,27,28,34,40,47]},
      {id:'m2',name:'はなこ',color:COLORS[2],visited:[4,7,9,10,11,12,13,14,17,22,24,26,27,29,33,37,42,43,47]},
      {id:'m3',name:'けんじ',color:COLORS[3],visited:[1,11,12,13,14,15,20,21,23,25,26,27,28,31,32,35,40,41,44,46]},
    ],
  };
}
let state = load() || {group:demo(), meId:null};
let tab = 'mine';
let focusMember = null;
let showGap = true;
let onboarding = !state.meId;

function load(){ try{ const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

const G = () => state.group;
const me = () => G().members.find(m=>m.id===state.meId);
const others = () => G().members.filter(m=>m.id!==state.meId);
const has = (m,id) => m.visited.includes(id);
const visitors = id => G().members.filter(m=>has(m,id));

// ---- map ----
const svg = document.getElementById('map');
(function drawMap(){
  const b = GEO.box;
  let s = `<rect class="inset" x="${b[0]-14}" y="${b[1]-40}" width="${b[2]-b[0]+28}" height="${b[3]-b[1]+54}" rx="10"/>`;
  s += `<text class="inset-label" x="${b[0]-2}" y="${b[1]-16}">沖縄</text>`;
  for(const id in P) s += `<path class="pref" data-id="${id}" d="${P[id].d}"><title>${P[id].n}</title></path>`;
  svg.innerHTML = s;
})();
svg.addEventListener('click', e=>{
  const p = e.target.closest('.pref'); if(!p || onboarding) return;
  onPref(+p.dataset.id);
});

function heat(n,total){
  if(!n) return 'var(--land)';
  if(n>=total) return 'var(--h4)';
  const r = n/total;
  return r<=1/3 ? 'var(--h1)' : r<=2/3 ? 'var(--h2)' : 'var(--h3)';
}
function fillFor(id){
  const m = tab==='mine' ? me() : tab==='member' ? G().members.find(x=>x.id===focusMember) : null;
  if(m) return has(m,id) ? m.color : 'var(--land)';
  const n = visitors(id).length;
  if(n===0 && showGap) return 'var(--gap-fill)';
  return heat(n, G().members.length);
}
function paintMap(){
  svg.querySelectorAll('.pref').forEach(p=>{
    const id = +p.dataset.id;
    p.style.fill = fillFor(id);
    p.classList.toggle('tap', true);
    p.classList.toggle('gap', tab==='all' && showGap && visitors(id).length===0);
  });
  // bring gap outlines to front so the stroke isn't hidden by neighbours
  svg.querySelectorAll('.pref.gap').forEach(p=>svg.appendChild(p));
}

// ---- render ----
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const avatar = (m,size) => `<span class="dot" style="background:${m.color};${size?`width:${size}px;height:${size}px;`:''}">${esc(m.name.slice(0,1))}</span>`;

function render(){
  $('gTitle').textContent = G().name;
  const m = me();
  $('meBtn').innerHTML = m ? `${avatar(m)}${esc(m.name)}` : 'ゲスト';
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected', b.dataset.tab===tab));
  if(tab==='member' && !G().members.some(x=>x.id===focusMember)) focusMember = (others()[0]||m||{}).id;
  renderSummary(); renderLegend(); renderGap(); renderList(); paintMap();
}

function renderSummary(){
  const el = $('summary');
  if(tab==='mine' && me()){
    const m = me(), n = m.visited.length;
    el.innerHTML = `<div class="big disp"><span class="n">${n}</span><span class="of">/ 47 都道府県に行った</span></div>
      <div class="bar"><i style="width:${n/47*100}%;background:${m.color}"></i></div>`;
    $('hint').textContent = '地図か下の一覧をタップすると「行った」を付け外しできます。';
  } else if(tab==='all'){
    const ms = [...G().members].sort((a,b)=>b.visited.length-a.visited.length);
    const union = Object.keys(P).filter(id=>visitors(+id).length).length;
    el.innerHTML = `<div class="big disp"><span class="n">${union}</span><span class="of">/ 47 誰かが行った（${G().members.length}人）</span></div>
      <div class="members">${ms.map(x=>`<div class="mrow"><span class="nm">${avatar(x)}${esc(x.name)}${x.id===state.meId?'<small style="color:var(--ink2)">（自分）</small>':''}</span>
      <div class="bar"><i style="width:${x.visited.length/47*100}%;background:${x.color}"></i></div><span class="cnt">${x.visited.length} / 47</span></div>`).join('')}</div>`;
    $('hint').textContent = '色が濃いほど、行ったことのある人が多い県です。タップすると誰が行ったか見られます。';
  } else {
    const f = G().members.find(x=>x.id===focusMember);
    el.innerHTML = `<div class="chips" role="group" aria-label="表示するメンバー">${G().members.map(x=>`<button type="button" class="mchip" style="--c:${x.color}" data-member="${x.id}" aria-pressed="${x.id===focusMember}">${avatar(x)}${esc(x.name)}</button>`).join('')}</div>
      ${f?`<div class="big disp"><span class="n">${f.visited.length}</span><span class="of">/ 47 ${esc(f.name)}さんが行った</span></div>`:''}`;
    $('hint').textContent = 'メンバーを選ぶと、その人が行った都道府県だけに色が付きます。';
  }
}

function renderLegend(){
  const el = $('legend');
  if(tab==='all'){
    const t = G().members.length;
    el.innerHTML = `<span><i style="background:var(--h4)"></i>全員（${t}人）</span>
      <span><i style="background:var(--h3)"></i>多い</span>
      <span><i style="background:var(--h1)"></i>少ない</span>
      ${showGap?`<span><i style="background:var(--gap-fill);border-color:var(--gap-line)"></i>全員まだ</span>`:`<span><i style="background:var(--land)"></i>全員まだ</span>`}`;
  } else {
    const m = tab==='mine' ? me() : G().members.find(x=>x.id===focusMember);
    el.innerHTML = m ? `<span><i style="background:${m.color}"></i>行った</span><span><i style="background:var(--land)"></i>まだ</span>` : '';
  }
}

function gapIds(){ return Object.keys(P).map(Number).filter(id=>visitors(id).length===0); }
function renderGap(){
  const el = $('gapcard');
  el.hidden = tab!=='all';
  if(el.hidden) return;
  const ids = gapIds();
  el.innerHTML = `<div class="gaphead"><b class="disp">全員まだ行っていない県 ${ids.length}</b>
    <button type="button" class="switch" id="gapToggle" aria-pressed="${showGap}">地図で強調</button></div>
    <div class="chips">${ids.length ? ids.map(id=>`<button type="button" class="pchip gapc" data-pref="${id}">${short(P[id].n)}</button>`).join('') : '<span style="color:var(--ink2)">全県だれかが行っています</span>'}</div>`;
}

function renderList(){
  const total = G().members.length;
  const m = tab==='mine' ? me() : tab==='member' ? G().members.find(x=>x.id===focusMember) : null;
  $('list').innerHTML = REGIONS.map(([name,ids])=>`<div class="region"><h3>${name}</h3><div class="chips">${ids.map(id=>{
    const label = short(P[id].n);
    if(m){
      const on = has(m,id);
      return `<button type="button" class="pchip${on?' on':''}" style="--pc:${m.color}" data-pref="${id}" aria-pressed="${on}">${label}</button>`;
    }
    const n = visitors(id).length;
    return `<button type="button" class="pchip" data-pref="${id}"><span class="sw" style="background:${heat(n,total)}"></span>${label}<em>${n}/${total}</em></button>`;
  }).join('')}</div></div>`).join('');
}

// ---- interactions ----
function onPref(id){
  if(tab==='mine' && me()) toggleMine(id);
  else openPrefSheet(id);
}
function toggleMine(id){
  const m = me(); const i = m.visited.indexOf(id);
  if(i>=0){ m.visited.splice(i,1); toast(`${P[id].n} を外しました`); }
  else { m.visited.push(id); toast(`${P[id].n} に行った！`); }
  save(); render();
}

document.addEventListener('click', e=>{
  const t = e.target.closest('[data-tab],[data-pref],[data-member],#gapToggle');
  if(!t || t.closest('#sheet')) return;
  if(t.dataset.tab){ tab = t.dataset.tab; render(); return; }
  if(t.dataset.member){ focusMember = t.dataset.member; render(); return; }
  if(t.id==='gapToggle'){ showGap = !showGap; render(); return; }
  if(t.dataset.pref) onPref(+t.dataset.pref);
});

// ---- sheet ----
const sheet = $('sheet'), scrim = $('scrim');
function openSheet(html, dismissable=true){
  sheet.innerHTML = `<div class="grab"></div>${html}`;
  sheet.hidden = false; scrim.hidden = false;
  scrim.onclick = dismissable ? closeSheet : null;
  const f = sheet.querySelector('input'); if(f) setTimeout(()=>f.focus(),50);
}
function closeSheet(){ sheet.hidden = true; scrim.hidden = true; }
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !sheet.hidden && !onboarding) closeSheet(); });

function openPrefSheet(id){
  const vs = visitors(id), total = G().members.length;
  const rows = [...G().members].sort((a,b)=>has(b,id)-has(a,id)).map(x=>`<div class="row${has(x,id)?' yes':''}">${avatar(x,26)}${esc(x.name)}${x.id===state.meId?'（自分）':''}<span class="st">${has(x,id)?'行った':'まだ'}</span></div>`).join('');
  const mine = me() && has(me(),id);
  openSheet(`<h2 class="disp">${P[id].n}</h2>
    <p class="sub">${vs.length ? `${total}人中 ${vs.length}人が行ったことがあります` : '全員まだ行ったことがありません。旅行先の候補にどうですか？'}</p>
    <div class="who">${rows}</div>
    ${me()?`<button type="button" class="primary${mine?' ghost':''}" id="sheetToggle">${mine?'自分の「行った」を外す':'自分も行ったことがある'}</button>`:''}`);
  const b = $('sheetToggle');
  if(b) b.onclick = ()=>{ toggleMine(id); openPrefSheet(id); };
}

// onboarding: name only, no sign-up
function openJoin(mode){
  onboarding = true;
  const g = G();
  if(mode==='create'){
    openSheet(`<h2 class="disp">新しいグループを作る</h2>
      <p class="sub">作ったあとに招待リンクを友達に送ります。</p>
      <form id="joinForm">
        <div class="field"><label for="gnameIn">グループ名</label><input id="gnameIn" required maxlength="20" placeholder="例：卒業旅行"></div>
        <div class="field"><label for="nameIn">あなたの名前</label><input id="nameIn" required maxlength="10" placeholder="例：さくら"></div>
        <button class="primary" type="submit">作ってはじめる</button>
      </form>
      ${state.meId?'':'<button type="button" class="linkbtn" id="toJoin">招待されたグループに参加する</button>'}`, !!state.meId);
    $('joinForm').onsubmit = e=>{
      e.preventDefault();
      const gn = $('gnameIn').value.trim(), nm = $('nameIn').value.trim(); if(!gn||!nm) return;
      const id = 'm'+Date.now();
      state.group = {code:Math.random().toString(36).slice(2,8), name:gn, members:[{id,name:nm,color:COLORS[0],visited:[]}]};
      state.meId = id; tab='mine'; save(); onboarding=false; closeSheet(); render(); openInvite(true);
    };
    const tj = $('toJoin'); if(tj) tj.onclick = ()=>openJoin('join');
    if(state.meId){ onboarding=false; scrim.onclick = closeSheet; }
    return;
  }
  openSheet(`<p class="sub" style="margin:0 0 6px">招待リンクから開きました</p>
    <div class="invite">
      <div class="avs">${g.members.slice(0,4).map(x=>avatar(x,30)).join('')}</div>
      <div><b class="disp" style="font-size:17px">${esc(g.name)}</b><br><small style="color:var(--ink2)">${g.members.map(x=>esc(x.name)).join('・')} が参加中</small></div>
    </div>
    <form id="joinForm">
      <div class="field"><label for="nameIn">あなたの名前</label><input id="nameIn" required maxlength="10" placeholder="例：さくら" autocomplete="nickname"></div>
      <p class="mock-note">会員登録はありません。同じ名前を入れると、その人として続きから操作できます。</p>
      <button class="primary" type="submit">参加する</button>
    </form>
    <button type="button" class="linkbtn" id="toCreate">新しいグループを作る</button>`, false);
  $('joinForm').onsubmit = e=>{
    e.preventDefault();
    const nm = $('nameIn').value.trim(); if(!nm) return;
    let m = g.members.find(x=>x.name===nm);
    if(m){ toast(`${nm} さんとして続きから`); }
    else {
      m = {id:'m'+Date.now(), name:nm, color:COLORS.find(c=>!g.members.some(x=>x.color===c)) || COLORS[g.members.length % COLORS.length], visited:[]};
      g.members.push(m); toast(`${g.name} に参加しました`);
    }
    state.meId = m.id; tab='mine'; save(); onboarding=false; closeSheet(); render();
  };
  $('toCreate').onclick = ()=>openJoin('create');
}

function openInvite(fresh){
  const url = `https://tabikaigi.example/g/${G().code}`;
  openSheet(`<h2 class="disp">${fresh?'グループができました':'友達を招待'}</h2>
    <p class="sub">このリンクを送ると、名前を入れるだけで「${esc(G().name)}」に参加できます。</p>
    <div class="urlbox"><code id="urlText">${url}</code><button type="button" class="iconbtn" id="copyBtn">コピー</button></div>
    <p class="mock-note">モックなのでリンクは仮のものです。データはこのブラウザの中にだけ保存されます。</p>
    <button type="button" class="primary" id="closeInv">閉じる</button>`);
  $('closeInv').onclick = closeSheet;
  $('copyBtn').onclick = ()=>{
    const done = ()=>toast('リンクをコピーしました');
    try{ navigator.clipboard.writeText(url).then(done, ()=>selectUrl()); }catch(e){ selectUrl(); }
  };
}
function selectUrl(){ const r=document.createRange(); r.selectNodeContents($('urlText')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast('リンクを選択しました'); }

function openSwitch(){
  const g = G();
  openSheet(`<h2 class="disp">ユーザーを切り替え</h2>
    <p class="sub">会員登録がないので、名前を選ぶだけでその人として操作できます。</p>
    <div class="namelist">${g.members.map(x=>`<button type="button" data-sw="${x.id}" aria-current="${x.id===state.meId}">${avatar(x,26)}${esc(x.name)}<span style="margin-left:auto;color:var(--ink2);font-size:13px">${x.visited.length}県</span></button>`).join('')}</div>
    <button type="button" class="primary ghost" id="newName">別の名前で参加する</button>
    <button type="button" class="linkbtn" id="resetDemo">デモのデータを最初に戻す</button>`);
  sheet.querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>{
    state.meId = b.dataset.sw; save(); closeSheet(); tab='mine'; render(); toast(`${me().name} さんに切り替えました`);
  });
  $('newName').onclick = ()=>{ state.meId=null; save(); render(); openJoin('join'); };
  $('resetDemo').onclick = ()=>{ state = {group:demo(), meId:null}; save(); tab='mine'; render(); openJoin('join'); };
}

$('shareBtn').onclick = ()=>{ if(!onboarding) openInvite(false); };
$('meBtn').onclick = ()=>{ if(!onboarding) openSwitch(); };

let tt;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,1800); }

// start: first visit shows the group in the background with the join sheet on top
if(onboarding){ tab='all'; render(); openJoin('join'); }
else render();
})();
</script>
